# MNIST deblurring on held-out MNIST test images.
# checkpoint_path: a checkpoint of a dual_mnist_upsample run (absolute or relative to the repository root).
checkpoint_path: results/mnist_upsample_14/<results_dir>/checkpoints/checkpoint_final.pt
num_samples: 64
evaluation_filename: evaluation.pt
few_step_steps: [1, 2, 4, 5, 10, 25, 50, 100]

output:
  base_dir: results/final_upsample
  plot_filename: source_above_generated_n50.png
  source_grid_filename: fresh_source_grid.png
  generated_grid_filename: generated_grid.png
  few_step_plot_filename: few_step_source_to_generated.png
  few_step_grid_filename_pattern: few_step_generated_grid_{step}_steps.png
  dpi: 200
  wspace: 0.1
  hspace: 0.1
