[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamicot"
version = "0.1.0"
description = "Generative modeling by value-driven transport (VDT)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "matplotlib>=3.10",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.5",
  "torchvision>=0.20",
]
authors = [
  { name = "adrianlmueller" },
  { name = "pmorenoz" },
  { name = "stnksrbtks" }
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
